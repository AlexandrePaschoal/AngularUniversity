<ion-header>
  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home">
      </ion-back-button>
    </ion-buttons>

    <ion-title>
      Favoritos
    </ion-title>

  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Cabeçalho -->

  <div class="page-header">

    <p class="subtitle">
      Suas universidades preferidas estão aqui!
    </p>

    <h1>
      Seus
      <span>favoritos</span>
    </h1>

  </div>


  <!-- Lista de favoritos -->

  <ion-list *ngIf="favorites.length">

    <ion-card
      *ngFor="let university of favorites"
      class="favorite-card">

      <ion-card-content>

        <div class="card-header">

          <div class="card-info">

            <!-- Universidade -->

            <h2 class="university-name">

              <ion-icon
                name="school-outline">
              </ion-icon>

              {{ university.name }}

            </h2>


            <!-- País -->

            <p class="university-country">

              <ion-icon
                name="location-outline">
              </ion-icon>

              {{ university.country }}

            </p>

          </div>


          <!-- Ações -->

          <div class="actions">

            <ion-button
              fill="clear"
              color="danger"
              aria-label="Remover dos favoritos"
              (click)="removeFavorite(university.name)">

              <ion-icon
                name="trash-outline"
                slot="icon-only">
              </ion-icon>

            </ion-button>

          </div>

        </div>


        <!-- Site -->

        <a
          class="university-link"
          [href]="university.web_pages[0]"
          target="_blank"
          rel="noopener noreferrer">

          <ion-icon
            name="open-outline">
          </ion-icon>

          {{ university.web_pages[0] }}

        </a>

      </ion-card-content>

    </ion-card>

  </ion-list>


  <!-- Estado vazio -->

  <div
    class="empty-state"
    *ngIf="favorites.length === 0">

    <ion-icon
      class="empty-icon"
      name="heart-outline">
    </ion-icon>

    <h2>
      Nenhum favorito encontrado
    </h2>

    <p>
      Adicione universidades na página de resultados.
    </p>

    <ion-button
      routerLink="/home"
      fill="outline">

      <ion-icon
        name="search-outline"
        slot="start">
      </ion-icon>

      Buscar universidades

    </ion-button>

  </div>

</ion-content>
